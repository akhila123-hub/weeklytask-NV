<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: rgb(195, 203, 224);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            display: flex;
            width: 80%;
            max-width: 900px;
            background-color: #fff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
        }
        .left, .right {
            flex: 1;
            padding: 20px;
        }
        .left {
            border-right: 2px solid rgb(92, 137, 195);
        }
        h1, h3 {
            text-align: center;
            margin-bottom: 20px;
            font-family: 'Rubik', sans-serif;
            color: rgba(26, 29, 211, 0.73);
        }
        input, button {
            width: 100%;
            height: 40px;
            border: 1px solid rgb(92, 137, 195);
            border-radius: 5px;
            padding: 0 10px;
            margin-bottom: 10px;
        }
        button {
            background-color: rgb(89, 118, 186);
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
        }
        .result {
            margin-top: 20px;
            padding: 20px;
            background-color: rgb(174, 190, 223);
            border-radius: 10px;
            display: none;
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
        .delete-btn {
            background-color: rgb(89, 118, 186);
            color: white;
            border: none;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div class="container">
  
    <div class="left">
        <h1>BMI Calculator</h1>
        <label>Weight (kg):</label>
        <input type="number" id="weightinkg" placeholder="Enter your weight in kg">
        <label>Height (cm):</label>
        <input type="number" id="heightincm" placeholder="Enter your height in cm">
        <button onclick="calculate()">Calculate</button>

        <div class="result">
            <h2>Your BMI is: <span id="bmiValue"></span></h2>
            <p id="bmiStatus"></p>
        </div>
    </div>

    <!-- Right Side: BMI History -->
    <div class="right">
        <h3>BMI History</h3>
        <table>
            <thead>
                <tr>
                    <th>Weight (kg)</th>
                    <th>Height (cm)</th>
                    <th>BMI</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="historyBody"></tbody>
        </table>
    </div>
</div>

<script>
    let bmiHistory = JSON.parse(localStorage.getItem("bmiHistory")) || [];

    const calculate = () => {
        let weight = parseFloat(document.getElementById('weightinkg').value);
        let heightCm = parseFloat(document.getElementById('heightincm').value);

        if (isNaN(weight) || isNaN(heightCm) || weight <= 0 || heightCm <= 0) {
            alert("Please enter valid weight and height.");
            return;
        }

        let heightM = heightCm / 100;
        let bmi = (weight / (heightM * heightM)).toFixed(2); 

        const categories = [
            { range: bmi < 18.5, status: "Underweight" },
            { range: bmi >= 18.5 && bmi <= 24.9, status: "Normal weight" },
            { range: bmi >= 25 && bmi <= 29.9, status: "Overweight" },
            { range: bmi >= 30, status: "Obese" }
        ];

        let status = categories.find(category => category.range)?.status || "Unknown";

        document.getElementById("bmiValue").innerText = bmi;
        document.getElementById("bmiStatus").innerText = `You are: ${status}`;
        document.querySelector(".result").style.display = "block";

        let historyEntry = { weight, height: heightCm, bmi, status };
        bmiHistory.push(historyEntry);

        localStorage.setItem("bmiHistory", JSON.stringify(bmiHistory));  
        updateHistory();
    };

    const updateHistory = () => {
        let historyBody = document.getElementById("historyBody");
        historyBody.innerHTML = "";

        bmiHistory.forEach((entry, index) => {
            let row = document.createElement("tr");
            row.innerHTML = `
                <td>${entry.weight}</td>
                <td>${entry.height}</td>
                <td>${entry.bmi}</td>
                <td>${entry.status}</td>
                <td><button class="delete-btn" onclick="deleteEntry(${index})">Delete</button></td>
            `;
            historyBody.appendChild(row);
        });
    };

    const deleteEntry = (index) => {
        bmiHistory.splice(index, 1); 
        localStorage.setItem("bmiHistory", JSON.stringify(bmiHistory)); 
        updateHistory(); 
    };

    window.onload = () => {
        let storedHistory = localStorage.getItem("bmiHistory"); 
        if (storedHistory) {
            bmiHistory = JSON.parse(storedHistory);
            updateHistory();
        }
    };
</script>

</body>
</html>
