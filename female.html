<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Female Watches</title>
    <link rel="stylesheet" href="mfcategory.css">
</head>
<body>
    <h2>Female Watches</h2>

    <div id="productList" class="product-container"></div>

    <a href="cart.html"><button>Go to Cart 🛒</button></a>

    <script>
        const apiUrl = "http://localhost:3000/products";
        const cartUrl = "http://localhost:3000/users";
        const container = document.getElementById("productList");

        function getLoggedInUserId() {
    return localStorage.getItem("loggedInUserId");
}
        const fetchFemaleProducts = () => {
            fetch(apiUrl)
                .then(res => res.json())
                .then(products => {
                    container.innerHTML = "";

                    
                    const femaleProducts = products.filter(product => product.category === "female");

                    if (femaleProducts.length === 0) {
                        container.innerHTML = "<p>No female watches available.</p>";
                        return;
                    }

                    container.innerHTML = femaleProducts.map(product => `
                        <div class="product-card">
                            <img src="${product.image}" alt="${product.name}" width="100">
                            <h3>${product.name}</h3>
                            <p>₹${product.price}</p>
                            <button onclick="addToCart('${product.id}', '${product.name}', ${product.price}, '${product.image}')">Add to Cart</button>
                        </div>
                    `).join("");
                })
                .catch(error => console.error("Error fetching female watches:", error));
        };

       const addToCart = async (id, name, price, image) => {
    const userId = getLoggedInUserId();
    if (!userId) {
        alert("Please log in to add items to your cart.");
        return;
    }

    try {
        const res = await fetch(`${cartUrl}/${userId}`);
        if (!res.ok) throw new Error("User not found");

        const userData = await res.json();
        let cart = userData.cart || [];

        const existingItem = cart.find(item => item.id === id);
        if (existingItem) {
            existingItem.quantity += 1;
        } else {
            cart.push({ id, name, price, image, quantity: 1 });
        }

        await fetch(`${cartUrl}/${userId}`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ cart })
        });

        alert(`${name} added to cart!`);
    } catch (error) {
        console.error("Error adding to cart:", error);
    }
};

        
        fetchFemaleProducts();
    </script>
</body>
</html>
