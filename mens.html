<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Men's Watches</title>
    <link rel="stylesheet" href="mfcategory.css">
</head>
<body>
    <h2>Available Men's Watches</h2>
    <div id="products" class="product-container"></div>
    
    <a href="cart.html"><button class="cart-button">Go to Cart 🛒</button></a>

    <script>
        const apiUrl = "http://localhost:3000/products";
        console.log(apiUrl);
        const cartUrl = "http://localhost:3000/cart";

        
        fetch(apiUrl)
            .then(res => res.json())
            .then(data => {
                console.log(data);
                const menProducts = data.filter(product => product.category === "mens"); // Filter only men's watches
                const container = document.getElementById("products");
                console.log(menProducts);
                container.innerHTML = menProducts.length > 0 ? menProducts.map(product => `
                    <div class="product-card">
                    <h2>${product.brand}</h2>
                        <img src="${product.image}" width="100">
                        <h3>${product.name}</h3>
                        <p>₹${product.price}</p>
                        <button class="add-to-cart" onclick="addToCart('${product.id}', '${product.name}', ${product.price}, '${product.image}')">Add to Cart</button>
                    </div>
                `).join("") : "<p>No Men's Watches available.</p>";
            })
            .catch(error => console.error("Error fetching products:", error));

       
        function addToCart(id, name, price, image) { 
            fetch(cartUrl)
                .then(res => res.json())
                .then(cart => {
                    const existingItem = cart.find(item => item.productId === id);
                    console.log(existingItem);

                    if (existingItem) {
                        
                        return fetch(`${cartUrl}/${existingItem.id}`, {
                            method: "PATCH",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ quantity: existingItem.quantity + 1 })
                        });
                    } else {
                        
                        const product = { productId: id, name, price, image, quantity: 1 };

                        return fetch(cartUrl, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify(product)
                        });
                    }
                })
                .then(res => {
                    if (res.ok) {
                        alert("Product added to cart!");
                    }
                })
                .catch(error => console.error("Error adding to cart:", error));
        }
    </script>
</body>
</html>
