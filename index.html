<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Stopwatch Timer</title>
    <style>
        body {
            font-family:'Baloo 2',cursive;
            text-align: center;
            margin-top: 50px;
            background-color:
        }
        #timer {
            font-size: 5em;
            margin-bottom: 20px;
            color:green;
        }
        button {
            font-size: 1em;
            font-weight:bold;
            margin: 5px;
            padding: 10px 20px;
            cursor: pointer;
            border-color:green;
            
            
        }
        button:hover{
            background-color:black;
            color:white;
            
        }
        .border{
            background color:blue;
            color:black;
            border-color:black;
        border-width:1px;
        
            border-style:dotted;
            padding-top:70px;
            padding-bottom:70px;
            margin-left:25%;
            margin-right:25%;
            
        }
        h1{
            
            background-color:#77dd88;
            color:black;
            margin-left:25%;
            margin-right:25%;
        }
    </style>
</head>

<body>
<h1>   Stop Watch  ⏱️</h1>
<div class="border">
    <div id="timer">start</div>
    <button onclick="startTimer()">Start</button>
    <button onclick="stopTimer()">Stop</button>
    <button onclick="resetTimer()">Reset</button>

</div>
    <script>
        let seconds = 0, minutes = 0, milliseconds = 0, interval;

        function formatTime() {
            return String(minutes).padStart(2, '0') + ":" + String(seconds).padStart(2, '0') + ":" + String(milliseconds).padStart(2, '0');
        }

        function startTimer() {
            if (!interval) {
                interval = setInterval(() => {
                    milliseconds++;
                    if (milliseconds === 100) {
                        milliseconds = 0;
                        seconds++;
                    }
                    if (seconds === 60) {
                        seconds = 0;
                        minutes++;
                    }
                    document.getElementById("timer").textContent = formatTime();
                }, 10); //------------10 every 10ms number change --->10ms=0.01 seconds -->1000ms= 1 second
            }
        }

        function stopTimer() {
            clearInterval(interval);
            interval = null;
        }

        function resetTimer() {
            stopTimer();
            seconds = 0;
            minutes = 0;
            milliseconds = 0;
            document.getElementById("timer").textContent = "00:00:00";
             
        }
    </script>

</body>
</html>
