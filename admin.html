<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Manage Products</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
<header class="navbar">
    <h1> JUST iN TIME </h1>
    <button id="logout-btn">Logout</button>  
</header>

    <h2>Admin - Add Product</h2>
    
    <label>Brand Name:</label>
    <input type="text" id="brand" placeholder="Enter brand name">

    <label>Product Name:</label>
    <input type="text" id="name" placeholder="Enter product name">
    
    <label>Price:</label>
    <input type="number" id="price" placeholder="Enter price">
    
    <label>Image URL:</label>
    <input type="text" id="image" placeholder="Enter image URL">
    
    <label>Category:</label>
    <select id="category">
        <option value="mens">Men's Watches</option>
        <option value="female">Female Watches</option>
    </select>

    <button id="addProduct">Add Product</button>

    <h2>Product List</h2>
    <div id="productList" class="product-container"></div>  

    <script src="admin.js"></script>
</body>
</html>
